# Fork-only test build. Never part of an upstream PR.
name: fork-test-build

on:
  push:
    branches: [ci/fork-test-builds]

permissions:
  contents: read

jobs:
  debug-apk:
    if: github.repository == 'urza-lab/wgtunnel-android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew formatCheck testStandaloneDebugUnitTest :app:assembleStandaloneDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: wgtunnel-android-debug-arm64
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/standalone/debug/*-arm64.apk
